<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tirrenia - Work in progress</title>
    <meta
      name="description"
      content="Tirrenia landing pages are being prepared. The public experience will be available soon."
    />
    <style>
      :root {
        color-scheme: light;
        --blue: #145d87;
        --ink: #302620;
        --muted: #756d67;
        --paper: #fffaf1;
        --line: rgba(20, 93, 135, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          radial-gradient(circle at top left, rgba(20, 93, 135, 0.08), transparent 36%),
          linear-gradient(135deg, #fffaf2 0%, #f4eee4 100%);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(100%, 680px);
        display: grid;
        gap: 24px;
        justify-items: center;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: clamp(28px, 7vw, 58px);
        background: rgba(255, 250, 241, 0.86);
        text-align: center;
        box-shadow: 0 22px 60px rgba(48, 38, 32, 0.12);
      }

      img {
        width: min(220px, 68vw);
        height: auto;
      }

      p,
      h1 {
        margin: 0;
      }

      .eyebrow {
        color: var(--blue);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 11ch;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(40px, 10vw, 76px);
        font-weight: 400;
        line-height: 0.96;
        letter-spacing: 0;
      }

      .copy {
        max-width: 48ch;
        color: var(--muted);
        font-size: clamp(16px, 3.8vw, 20px);
        line-height: 1.45;
      }

      .langs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      .langs a {
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 15px;
        color: var(--blue);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logos/logo-tirrenia.svg" alt="Tirrenia" />
      <p class="eyebrow">Tirrenia</p>
      <h1>Work in progress</h1>
      <p class="copy">
        We are preparing the new public Tirrenia experience. Please come back soon.
      </p>
      <nav class="langs" aria-label="Languages">
        <a href="/it/">Italiano</a>
        <a href="/nl/">Nederlands</a>
        <a href="/en/">English</a>
      </nav>
    </main>
  </body>
</html>
